# ---------------------------------------------------------------------
# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy with: New > Blueprint > point at this repository
# ---------------------------------------------------------------------
services:
  - type: web
    name: smart-farmer-assistant
    runtime: python
    plan: free
    region: singapore              # closest region to Indian users
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python ml/train_all.py
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong random secret
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false                # paste your managed MySQL URL in the dashboard
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

{% extends 'base.html' %}
{% block title %}{{ code }} · Smart Farmer Assistant{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 text-center">
      <div class="card-soft p-5 fade-up">
        <div class="display-1 display-serif" style="color: var(--brand);">{{ code }}</div>
        <h1 class="h4 mt-2 mb-2">{{ title }}</h1>
        <p class="text-muted-2">{{ message }}</p>
        <div class="d-flex gap-2 justify-content-center mt-3">
          <a class="btn btn-brand" href="{{ url_for('main.index') }}"><i class="bi bi-house me-1"></i>Home</a>
          {% if current_user.is_authenticated %}
          <a class="btn btn-ghost" href="{{ url_for('dashboard.home') }}">Dashboard</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

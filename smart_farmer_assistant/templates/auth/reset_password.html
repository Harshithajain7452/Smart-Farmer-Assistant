{% extends 'base.html' %}
{% block title %}Set a new password · Smart Farmer Assistant{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card-soft p-4 p-md-5 fade-up">
        <h1 class="h4 mb-3">Set a new password</h1>
        {% include 'partials/flash.html' %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="8">
            <div class="form-text">At least 8 characters with one letter and one number.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
          </div>
          <button class="btn btn-brand w-100">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
